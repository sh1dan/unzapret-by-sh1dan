[package]
name = "local-dpi-bypass"
version = "1.0.5-rc.1"
edition = "2021"
rust-version = "1.74"
license = "MIT"
description = "Experimental local Windows TCP segmentation with explicit destination filtering"
publish = false

[workspace]
members = ["crates/windivert-adapter"]
resolver = "2"

[dependencies]
windivert-adapter = { path = "crates/windivert-adapter" }
toml = { version = "=0.8.23", default-features = false, features = ["parse"] }

[lib]
name = "local_dpi_bypass"
path = "src/lib.rs"

[[bin]]
name = "dpi-bypass"
path = "src/CLI/main.rs"

[profile.release]
overflow-checks = true
lto = true
codegen-units = 1
