ips_file = "ips.txt"
tcp_ports = [443]
udp_ports = []

[filters]
exclude_domains_file = "exclude-domains.txt"
exclude_ips_file = "exclude-ips.txt"
unknown_action = "pass-through"

[strategy]
name = "split-tcp"

[strategies.pass-through]
enabled = true

[strategies.split-tcp]
enabled = true


[strategies.split-tls]
enabled = false

[strategies.reorder]
enabled = false

[strategies.decoy]
enabled = false

[strategies.quic]
enabled = false

[strategies.stun]
enabled = false

[logging]
level = "info"
packet_payload_logging = false
path = "logs/app.log"
max_bytes = 1048576
retained_files = 3

