# Phase 1 schema proposal. No runtime TOML loader exists yet.
schema_version = 1

[engine]
dry_run = false
max_flows = 4096
flow_idle_seconds = 30
max_initial_bytes = 16384
max_packets_per_flow = 4


[targets.youtube]
enabled = true
domains_file = "presets/youtube/domains.txt"
ips_file = "ips.txt"
tcp_ports = [443]
udp_ports = [443]

[targets.discord]
enabled = true
domains_file = "presets/discord/domains.txt"
ips_file = "ips.txt"
tcp_ports = [443, 2053, 2083, 2087, 2096, 8443]
udp_ports = []

[targets.twitch]
enabled = true
domains_file = "presets/twitch/domains.txt"
ips_file = "ips.txt"
tcp_ports = [443]
udp_ports = []

[targets.telegram]
enabled = true
domains_file = "presets/telegram/domains.txt"
ips_file = "ips.txt"
tcp_ports = [443]
udp_ports = []

