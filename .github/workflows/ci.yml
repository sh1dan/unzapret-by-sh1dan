name: CI & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build offline (no third-party crates)
        run: cargo build --offline --all-targets
      - name: Contract tests (main crate)
        run: cargo test --offline
      - name: Contract tests (windivert-adapter crate)
        run: cargo test -p windivert-adapter --offline
      - name: CLI smoke test
        run: |
          cargo run --offline -- status
          cargo run --offline -- test --mock
          cargo run --offline -- service status
          cargo run --offline -- diagnose
          cargo run --offline -- logs

  release:
    name: Build & Publish Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Release Binary
        run: cargo build --release --offline
      - name: Update Run Package Binary
        shell: pwsh
        run: Copy-Item target/release/dpi-bypass.exe run/dpi-bypass.exe -Force
      - name: Create Release Zip Package
        shell: pwsh
        run: |
          $zipName = "unzapret-by-sh1dan-${{ github.ref_name }}-windows-x64.zip"
          Compress-Archive -Path run/* -DestinationPath $zipName -Force
          Get-Item $zipName
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: unzapret-by-sh1dan-*.zip
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true

