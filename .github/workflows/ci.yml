name: CI & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Windows Tests & Smoke Check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo Build
        run: cargo build --all-targets

      - name: Unit and Contract Tests
        run: cargo test

      - name: WinDivert Adapter Tests
        run: cargo test -p windivert-adapter

      - name: CLI Smoke Tests
        run: |
          cargo run -- status
          cargo run -- test --mock
          cargo run -- service status
          cargo run -- diagnose
          cargo run -- logs

  release:
    name: Build & Publish Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release Binary
        run: cargo build --release

      - name: Update Run Package Binary
        shell: pwsh
        run: |
          Copy-Item target/release/dpi-bypass.exe run/dpi-bypass.exe -Force
          Get-Item run/dpi-bypass.exe

      - name: Create Release Zip Package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zipName = "unzapret-by-sh1dan-$tag-windows-x64.zip"
          Compress-Archive -Path run/* -DestinationPath $zipName -Force
          Get-Item $zipName

      - name: Upload GitHub Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: unzapret-by-sh1dan-*.zip
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true


