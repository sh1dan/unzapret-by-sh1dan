name: CI & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests & Smoke Check
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Cargo Build
        run: cargo build --workspace --all-targets --locked

      - name: Unit and Contract Tests
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: CLI Smoke Tests
        run: |
          cargo run --locked -- --version
          cargo run --locked -- status
          cargo run --locked -- test --mock

  release:
    permissions:
      contents: write
    name: Build & Publish Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release Binary
        run: cargo build --release --locked

      - name: Update Run Package Binary
        shell: pwsh
        run: |
          Copy-Item target/release/dpi-bypass.exe run/dpi-bypass.exe -Force
          Get-Item run/dpi-bypass.exe

      - name: Stage clean package and regenerate hashes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item run/config,run/WinDivert,run/dpi-bypass.exe,run/*.cmd,run/CHECK-FIRST.txt -Destination package -Recurse
          Copy-Item README.md,LICENSE -Destination package
          Copy-Item docs -Destination package -Recurse
          $root = (Resolve-Path package).Path
          $lines = Get-ChildItem package -Recurse -File | Sort-Object FullName | ForEach-Object {
            $relative = [System.IO.Path]::GetRelativePath($root, $_.FullName).Replace('\', '/')
            '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $relative
          }
          $lines | Set-Content package/SHA256SUMS.txt -Encoding utf8

      - name: Create Release Zip Package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zipName = "unzapret-by-sh1dan-$tag-windows-x64.zip"
          Compress-Archive -Path package/* -DestinationPath $zipName -Force
          Get-Item $zipName

      - name: Clean up obsolete release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{ "Authorization" = "token $env:GH_TOKEN"; "User-Agent" = "PowerShell" }
          $rel = try { Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" -Headers $headers } catch { $null }
          if ($rel -and $rel.assets) {
              foreach ($a in $rel.assets) {
                  if ($a.name -eq "SHA256SUMS.txt") {
                      Invoke-RestMethod -Uri $a.url -Method Delete -Headers $headers
                  }
              }
          }

      - name: Upload GitHub Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: unzapret-by-sh1dan-*.zip
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: .github/release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc.') }}





